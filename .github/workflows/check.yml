name: Python checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q gimp-spot-heal
      - run: python tools/build_legacy.py --check
      - run: python -m py_compile legacy/spot-heal-210.py
  python27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared core and legacy syntax on Python 2.7
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:2.7 python -m unittest discover -s tests -v
          docker run --rm -v "$PWD:/work" -w /work python:2.7 python -m py_compile legacy/spot-heal-210.py
