name: Mask healing checks
on: [push, pull_request]
jobs:
  python3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_plugin.py --check
      - run: python -m py_compile legacy/spot-heal-mask-210.py
  python27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD:/work" -w /work python:2.7 python -m unittest discover -s tests -v
          docker run --rm -v "$PWD:/work" -w /work python:2.7 python -m py_compile legacy/spot-heal-mask-210.py
